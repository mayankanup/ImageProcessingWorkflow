version: "3.8"

services:
  temporal:
    image: temporalio/auto-setup:latest
    ports:
      - "7233:7233"   # Temporal frontend
      - "8233:8233"   # Temporal Web UI
    environment:
      - DB=sqlite
      - TEMPORAL_UI_PORT=8233

  worker1:
    build: .
    command: python worker.py
    depends_on:
      - temporal

  worker2:
    build: .
    command: python worker.py
    depends_on:
      - temporal

  worker3:
    build: .
    command: python worker.py
    depends_on:
      - temporal
